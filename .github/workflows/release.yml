name: Release

# Changesets-driven release, running entirely on credentials GitHub mints for
# the run itself — no personal access token, no NPM_TOKEN:
#
#   git -> the built-in GITHUB_TOKEN (`contents: write`)
#   npm -> OIDC trusted publishing (`id-token: write`), configured per package
#          under "Trusted publisher" in its settings on npmjs.com
#
# On every push to main this applies the pending changesets (version bumps +
# changelogs), publishes the packages whose version is not on npm yet, and
# pushes the version commit together with the release tags.
#
# Versioning and publishing deliberately happen in the same run. A push made
# with GITHUB_TOKEN does not start another workflow run, so a release must
# never depend on its own version commit re-triggering this workflow — which is
# exactly what the previous Release-PR flow needed a PAT for.

on:
  push:
    branches: [main]

# Don't cancel an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Version / publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit and the release tags
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The version commit and the tags are pushed from this job, so the
          # checkout keeps its credentials — the run's own GITHUB_TOKEN.
          persist-credentials: true # zizmor: ignore[artipacked]
          # `changeset publish` tags each released package, so it needs the
          # existing tags and the history behind them.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          # No registry-url on purpose: it writes an .npmrc entry pointing at
          # NODE_AUTH_TOKEN, and there is no such token here. pnpm defaults to
          # registry.npmjs.org and gets its publish credentials from OIDC.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pending changesets
        id: version
        run: |
          pnpm changeset version
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No pending changesets — nothing to version.'
            echo 'versioned=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit --message 'chore: release packages'
          echo 'versioned=true' >> "$GITHUB_OUTPUT"

      # `changeset publish` skips every package whose version is already on the
      # registry, so this is a no-op unless the step above bumped something (or
      # an earlier run bumped it but failed to publish). Each published package
      # gets a local release tag.
      - name: Publish to npm
        run: pnpm ci:publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # Pushed only after a successful publish: when publishing fails the
      # version commit stays local and the changesets are retried next run.
      - name: Push the version commit
        if: steps.version.outputs.versioned == 'true'
        run: git push origin "HEAD:$BRANCH"
        env:
          BRANCH: ${{ github.ref_name }}

      - name: Push the release tags
        run: git push origin --tags
